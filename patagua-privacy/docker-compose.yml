services:
  postgres:
    image: postgres:16-alpine
    container_name: patagua-privacy-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-patagua_privacy}
      POSTGRES_USER: ${POSTGRES_USER:-patagua}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patagua}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-patagua} -d ${POSTGRES_DB:-patagua_privacy}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: patagua-privacy-backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://patagua:patagua@postgres:5432/patagua_privacy}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    container_name: patagua-privacy-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  frontend_node_modules:
